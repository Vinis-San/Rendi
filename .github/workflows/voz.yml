# Narração com TTS local em CPU (Supertonic ou Kokoro-82M), uma voz por job, em paralelo.
# "motor" no variacoes.json: "supertonic" (padrão; vozes M1..M5, F1), "kokoro" (pf_dora, pm_alex, pm_santa)
# ou "hf" (chama um Space do Hugging Face; "space" no variacoes.json, vozes = variantes como "exag0.5").
# Como usar: branch voz/<pasta> com a pasta na raiz contendo roteiro.json e variacoes.json:
#   {"vozes": ["M1","M2","M3","M4","M5","F1"], "velocidades": [1.0, 1.15], "pausa": 0.6, "lang": "pt"}
# Só texto próprio (o repositório é público). Saída: artefato "voz-<pasta>" com os mp3, comparativo.md/json e index.html.
# A branch é apagada ao fim.
name: voz

on:
  push:
    branches: ["voz/**"]

permissions:
  contents: write

jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      pasta: ${{ steps.p.outputs.pasta }}
      vozes: ${{ steps.p.outputs.vozes }}
      motor: ${{ steps.p.outputs.motor }}
      inicio: ${{ steps.p.outputs.inicio }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          pasta="${GITHUB_REF_NAME#voz/}"
          echo "pasta=$pasta" >> "$GITHUB_OUTPUT"
          echo "vozes=$(jq -c '.vozes // ["M1","M2","M3","M4","M5","F1"]' "$pasta/variacoes.json")" >> "$GITHUB_OUTPUT"
          echo "motor=$(jq -r '.motor // "supertonic"' "$pasta/variacoes.json")" >> "$GITHUB_OUTPUT"
          echo "inicio=$(date +%s)" >> "$GITHUB_OUTPUT"

  gerar:
    needs: plano
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        voz: ${{ fromJson(needs.plano.outputs.vozes) }}
    env:
      PASTA: ${{ needs.plano.outputs.pasta }}
      MOTOR: ${{ needs.plano.outputs.motor }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: voz/requirements.txt }
      - name: Cache do modelo
        uses: actions/cache@v4
        with: { path: ~/.cache, key: "${{ needs.plano.outputs.motor }}-modelo-v1" }
      - run: pip install -r voz/requirements.txt
      - name: Cliente do Hugging Face
        if: env.MOTOR == 'hf'
        run: pip install gradio_client
      - name: Modelo do Kokoro
        if: env.MOTOR == 'kokoro'
        run: |
          pip install kokoro-onnx
          mkdir -p ~/.cache/kokoro && cd ~/.cache/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -sfL --retry 3 -o kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -s voices-v1.0.bin ] || curl -sfL --retry 3 -o voices-v1.0.bin $base/voices-v1.0.bin
      - name: Gerar
        run: |
          inicio=$(date +%s)
          python "voz/gerar_${MOTOR}.py" "$PASTA" "${{ matrix.voz }}" saida
          echo "job_s=$(( $(date +%s) - inicio ))" > "saida/${{ matrix.voz }}-job.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.voz }}
          path: saida
          retention-days: 1

  juntar:
    needs: [plano, gerar]
    if: always()
    runs-on: ubuntu-latest
    env:
      PASTA: ${{ needs.plano.outputs.pasta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: parte-*
          path: saida
          merge-multiple: true
      - name: Comparativo
        run: |
          wall=$(( $(date +%s) - ${{ needs.plano.outputs.inicio }} ))
          python voz/comparar.py saida "$wall" "${{ needs.plano.outputs.motor }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: voz-${{ needs.plano.outputs.pasta }}
          path: saida
          retention-days: 14
      - name: Apagar a branch
        if: always()
        run: git push origin --delete "${GITHUB_REF_NAME}" || true
