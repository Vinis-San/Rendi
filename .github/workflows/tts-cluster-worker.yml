name: Narration batch worker

on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string
      blocks:
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      ENGINE_COMMIT: ef339be58a778b062e1c14382347964552eae007
      MODEL_COMMIT: fd4b254389122332181a7c3db7f27e918eec64e3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare CPU engine and synthetic reference
        run: |
          lscpu | grep -E '^CPU\(s\):|^Model name:'
          free -m
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev espeak-ng
          git init engine
          git -C engine fetch --depth 1 https://github.com/gabriele-mastrapasqua/qwen3-tts.git "$ENGINE_COMMIT"
          git -C engine checkout --detach FETCH_HEAD
          make -C engine -j4 blas
          espeak-ng -v pt-br -s 155 -w raw.wav 'Hoje temos um teste de narração. Cada frase fará parte de uma história curta gravada em português.'
          ffmpeg -hide_banner -loglevel error -i raw.wav -ar 24000 -ac 1 -c:a pcm_s16le reference.wav
      - name: Download pinned Qwen Base weights
        run: |
          model_url="https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-Base/resolve/$MODEL_COMMIT"
          mkdir -p model/speech_tokenizer
          for file in config.json generation_config.json merges.txt model.safetensors preprocessor_config.json tokenizer_config.json vocab.json speech_tokenizer/config.json speech_tokenizer/configuration.json speech_tokenizer/model.safetensors speech_tokenizer/preprocessor_config.json; do
            curl --fail --silent --show-error --location --retry 3 "$model_url/$file" -o "model/$file"
          done
      - name: Generate assigned blocks
        env:
          BLOCKS: ${{ inputs.blocks }}
        run: python3 tts-cluster/render.py render "$BLOCKS"
      - name: Assemble serial narration
        if: inputs.label == 'serial'
        run: python3 tts-cluster/render.py assemble serial
      - uses: actions/upload-artifact@v4
        with:
          name: narration-${{ inputs.label }}
          path: ${{ inputs.label == 'serial' && 'assembled/' || 'output/' }}
          if-no-files-found: error
          retention-days: 7
