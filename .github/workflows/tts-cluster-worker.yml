name: Narration batch worker

on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string
      blocks:
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      ENGINE_COMMIT: ef339be58a778b062e1c14382347964552eae007
      MODEL_COMMIT: fd4b254389122332181a7c3db7f27e918eec64e3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare CPU engine and synthetic reference
        run: |
          lscpu | grep -E '^CPU\(s\):|^Model name:'
          free -m
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev espeak-ng sox
          git init engine
          git -C engine fetch --depth 1 https://github.com/gabriele-mastrapasqua/qwen3-tts.git "$ENGINE_COMMIT"
          git -C engine checkout --detach FETCH_HEAD
          make -C engine -j4 blas
          espeak-ng -v pt-br -s 155 -w raw.wav 'Hoje temos um teste de narração. Cada frase fará parte de uma história curta gravada em português.'
          sox raw.wav -r 24000 -c 1 -b 16 reference.wav
      - uses: actions/cache/restore@v4
        id: weights
        with:
          path: model
          key: qwen-tts-base-${{ env.MODEL_COMMIT }}
      - name: Download pinned weights if the cache is unavailable
        if: steps.weights.outputs.cache-hit != 'true'
        run: bash tts-cluster/download-model.sh "$MODEL_COMMIT"
      - name: Generate assigned blocks
        env:
          BLOCKS: ${{ inputs.blocks }}
        run: python3 tts-cluster/render.py render "$BLOCKS"
      - name: Assemble serial narration
        if: inputs.label == 'serial'
        run: python3 tts-cluster/render.py assemble serial
      - uses: actions/upload-artifact@v4
        with:
          name: narration-${{ inputs.label }}
          path: ${{ inputs.label == 'serial' && 'assembled/' || 'output/' }}
          if-no-files-found: error
          retention-days: 7
