name: Narration batch benchmark

on:
  push:
    branches: ['tts-cluster/**']
    paths: ['.github/workflows/tts-cluster.yml', '.github/workflows/tts-cluster-worker.yml', 'tts-cluster/**']

permissions:
  contents: read

jobs:
  model:
    name: Prepare shared Qwen weights
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      MODEL_COMMIT: fd4b254389122332181a7c3db7f27e918eec64e3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: weights
        with:
          lookup-only: true
          path: model
          key: qwen-tts-base-${{ env.MODEL_COMMIT }}
      - name: Download pinned weights
        if: steps.weights.outputs.cache-hit != 'true'
        run: bash tts-cluster/download-model.sh "$MODEL_COMMIT"
      - uses: actions/cache/save@v4
        if: steps.weights.outputs.cache-hit != 'true'
        with:
          path: model
          key: qwen-tts-base-${{ env.MODEL_COMMIT }}

  serial:
    name: Serial batch
    needs: model
    uses: ./.github/workflows/tts-cluster-worker.yml
    with:
      label: serial
      blocks: '1 2 3 4'

  parallel:
    name: Parallel block ${{ matrix.block }}
    needs: model
    strategy:
      fail-fast: false
      matrix:
        block: ['1', '2', '3', '4']
    uses: ./.github/workflows/tts-cluster-worker.yml
    with:
      label: part-${{ matrix.block }}
      blocks: ${{ matrix.block }}

  assemble:
    name: Assemble parallel narration
    needs: parallel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: narration-part-*
          path: batches
      - name: Assemble and verify all blocks
        run: python3 tts-cluster/render.py assemble parallel
      - uses: actions/upload-artifact@v4
        with:
          name: narration-parallel
          path: assembled/
          if-no-files-found: error
          retention-days: 7
