name: Narration batch benchmark

on:
  push:
    branches: ['tts-cluster/**']
    paths: ['.github/workflows/tts-cluster.yml', '.github/workflows/tts-cluster-worker.yml', 'tts-cluster/**']

permissions:
  contents: read

jobs:
  serial:
    name: Serial batch
    uses: ./.github/workflows/tts-cluster-worker.yml
    with:
      label: serial
      blocks: '1 2 3 4'

  parallel:
    name: Parallel block ${{ matrix.block }}
    strategy:
      fail-fast: false
      matrix:
        block: ['1', '2', '3', '4']
    uses: ./.github/workflows/tts-cluster-worker.yml
    with:
      label: part-${{ matrix.block }}
      blocks: ${{ matrix.block }}

  assemble:
    name: Assemble parallel narration
    needs: parallel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: narration-part-*
          path: batches
      - name: Assemble and verify all blocks
        run: python3 tts-cluster/render.py assemble parallel
      - uses: actions/upload-artifact@v4
        with:
          name: narration-parallel
          path: assembled/
          if-no-files-found: error
          retention-days: 7
